version: "3.9"

# =============================================================================
# ElektraLog — Docker Compose
# All configuration via .env — no hardcoded secrets or ports!
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — persistent data store
  # NOTE: Backup via docker/postgres/backup.sh — run manually or via cron.
  #       No automatic backup in Compose; see docker/postgres/backup.sh.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./packages/elektralog_server/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./packages/elektralog_server/migrations/002_seed_permissions.sql:/docker-entrypoint-initdb.d/002_seed_permissions.sql:ro
      - ./packages/elektralog_server/migrations/003_superadmin.sql:/docker-entrypoint-initdb.d/003_superadmin.sql:ro
      - ./packages/elektralog_server/migrations/004_protokolle.sql:/docker-entrypoint-initdb.d/004_protokolle.sql:ro
      - ./packages/elektralog_server/migrations/005_aktualisiert_am.sql:/docker-entrypoint-initdb.d/005_aktualisiert_am.sql:ro
      - ./packages/elektralog_server/migrations/006_default_rollen.sql:/docker-entrypoint-initdb.d/006_default_rollen.sql:ro
      - ./packages/elektralog_server/migrations/007_firma_adresse.sql:/docker-entrypoint-initdb.d/007_firma_adresse.sql:ro
      - ./packages/elektralog_server/migrations/008_sync_revision.sql:/docker-entrypoint-initdb.d/008_sync_revision.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - elektralog

  # ---------------------------------------------------------------------------
  # App — Flutter Web (lokal gebaut, via Git ausgeliefert, Nginx serviert)
  # WICHTIG: flutter build web läuft LOKAL, nicht auf dem Server (zu wenig RAM).
  # Build-Output liegt in ./docker/app_web/ und ist per Git committed.
  # ---------------------------------------------------------------------------
  app:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/app_web:/usr/share/nginx/html:ro
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elektralog

  # ---------------------------------------------------------------------------
  # Serverpod — Dart HTTP backend (always active from Phase 2)
  # Port öffentlich gebunden (wie app/superadmin), da der externe Reverse-Proxy
  # (NPM) elektralogbackend.kay-beckmann.de direkt auf SERVERPOD_PORT über die
  # Server-IP weiterleitet, nicht über das Docker-Netzwerk.
  # ---------------------------------------------------------------------------
  serverpod:
    build:
      context: ./packages/elektralog_server
      dockerfile: Dockerfile
    image: elektralog-serverpod:latest
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8888}
      SUPERADMIN_URL: ${SUPERADMIN_URL:-http://localhost:8889}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
    ports:
      - "${SERVERPOD_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elektralog

  # ---------------------------------------------------------------------------
  # SuperAdmin — Verwaltungs-Frontend für Firmen und Zugänge
  # ---------------------------------------------------------------------------
  superadmin:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./superadmin:/usr/share/nginx/html:ro
      - ./superadmin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${SUPERADMIN_PORT:-8889}:80"
    networks:
      - elektralog

  # ---------------------------------------------------------------------------
  # Wiki.js — internal documentation (company profile only)
  # ---------------------------------------------------------------------------
  wiki:
    image: requarks/wiki:2
    profiles: ["company"]
    restart: unless-stopped
    environment:
      DB_TYPE: postgres
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${WIKIJS_DB}
      SECRET_KEY: ${WIKI_SECRET}
    ports:
      - "${WIKI_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elektralog

  # ---------------------------------------------------------------------------
  # Homepage — project landing page (company profile only)
  # ---------------------------------------------------------------------------
  homepage:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./homepage:/usr/share/nginx/html:ro
      - ./homepage/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HOMEPAGE_PORT}:80"
    networks:
      - elektralog
    profiles: ["company"]

volumes:
  postgres_data:
    driver: local

networks:
  elektralog:
    driver: bridge
